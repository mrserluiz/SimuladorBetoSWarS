<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Um simulador geopolítico por turnos"><title>Meridiano — Estratégia Global</title><link rel="stylesheet" href="style.css"><script type="module" src="game.js"></script></head>
<body>
<header class="top"><div class="brand"><div class="logo">◎</div><div><strong>MERIDIANO</strong><small>ESTRATÉGIA GLOBAL</small></div></div><div class="top-actions"><button id="guide" class="quiet">? &nbsp; Guia</button><button id="new">Nova campanha</button></div></header>
<main>
<section class="heading"><div><p class="kicker"><i></i> CENTRO DE COMANDO</p><h1>Panorama mundial</h1><p id="campaign">Cenário contemporâneo · Campanha individual</p></div><div class="advance"><div><small>CALENDÁRIO</small><strong id="date">—</strong></div><button class="primary" id="next">Avançar turno <span>→</span></button></div></section>
<section id="metrics" class="metrics" aria-label="Indicadores da campanha"></section>
<section class="dashboard">
<div class="theater"><div class="sectionbar"><div><h2>Mapa estratégico</h2><small id="mapstatus">INTERATIVO</small></div><div class="layers"><button class="on" data-layer="politico">Político</button><button data-layer="economia">Economia</button><button data-layer="conflitos">Conflitos</button></div></div>
<div id="viewport"><svg id="map" viewBox="0 0 1200 530" aria-label="Mapa mundial interativo"><defs><pattern id="grid" width="50" height="35" patternUnits="userSpaceOnUse"><path d="M50 0H0V35" fill="none" stroke="#263b49" stroke-width=".6"/></pattern></defs><rect width="1200" height="530" fill="url(#grid)"/><g id="camera"><g id="land"></g><g class="oceans" aria-hidden="true"><text x="110" y="314">OCEANO PACÍFICO</text><text x="395" y="264">ATLÂNTICO</text><text x="798" y="342">OCEANO ÍNDICO</text></g><g id="routes"></g><g id="markers"></g></g></svg><div class="zoom"><button id="plus" aria-label="Aumentar zoom">+</button><button id="minus" aria-label="Diminuir zoom">−</button><button id="home" aria-label="Recentrar mapa">⌖</button></div><div class="coords" id="coords">VISÃO GLOBAL</div></div>
<div class="legend" id="legend"></div>
</div>
<aside class="command"><div id="nation"></div><div class="tabs"><button data-tab="ops" class="on">Operações</button><button data-tab="chat">Diplomacia</button></div><div id="panel"></div></aside>
</section>
<section class="lower"><div class="brief"><div class="sectionbar"><div><h2>Registro de campanha</h2><small>EVENTOS POR TURNO</small></div></div><div id="log"></div></div><div class="brief"><div class="sectionbar"><div><h2>Movimentações</h2><small>ORDENS EM TRÂNSITO</small></div></div><div id="missions"></div></div></section>
<footer><span>MERIDIANO <b>·</b> SIMULAÇÃO GEOPOLÍTICA</span><button id="sources" class="quiet">Dados e metodologia ↗</button></footer>
</main>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close" aria-label="Fechar">×</button></div><div id="modal-body"></div></dialog>
<output id="toast" role="status"></output>
</body></html>
